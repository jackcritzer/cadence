version: "3.8"

services:
  backend:
    build: ./backend
    container_name: cadence-backend
    ports:
      - "3000:3000"  # Host:Container
    env_file:
      - ./backend/.env
    restart: unless-stopped

  landing:
    build: ./landing
    container_name: cadence-landing
    ports:
      - "3001:3000"
    env_file:
      - ./landing/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cadence-frontend
    ports:
      - "3002:3000"
    env_file:
      - ./frontend/.env
    restart: unless-stopped

 
