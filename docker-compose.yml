services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env.production
    depends_on:
      - db
    command: ["pnpm", "start"]

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cadence
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: